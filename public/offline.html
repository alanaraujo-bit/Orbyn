<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Orbyn</title>
    <!--
      Served by the service worker when a page load fails with no network.
      It is a static file with no data in it: the panel is behind a password and
      this file is public, so it must stay a placeholder and nothing more.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #fbfbfc;
        --surface: #ffffff;
        --line: #e4e6ea;
        --ink: #33373f;
        --ink-muted: #7c818b;
        --accent: #2f66c4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #1b1d21;
          --surface: #23262a;
          --line: #383c42;
          --ink: #f0f1f3;
          --ink-muted: #a6abb3;
          --accent: #7d9df0;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          calc(16px + env(safe-area-inset-left));
        background: var(--canvas);
        color: var(--ink);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 360px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        padding: 24px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      h1 {
        margin: 16px 0 0;
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 8px 0 0;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--ink-muted);
      }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" width="56" height="56" />
      <h1>Sem conexão</h1>
      <p>
        O painel só mostra números ao vivo, então nada é exibido sem rede. Assim que a conexão voltar, toque em tentar
        novamente.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
    <script>
      // Reload the moment the connection comes back, so the operator does not
      // have to notice and tap.
      addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
